# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=Student Skill and Certification Tracking System

# Default Database: File-backed H2 (Persistent & Zero Setup)
spring.datasource.url=jdbc:h2:file:./data/rtps_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# File Upload Configuration (for certificates, resumes, avatars)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=9a67279c2f86e1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
app.jwt.expiration-ms=86400000

# File Storage Directory
app.upload.dir=./uploads
